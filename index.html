<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Count & Guest Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased p-2 md:p-4 min-h-screen">
  <div class="max-w-6xl mx-auto space-y-2">
    
    <!-- Ultra-Compact Top Bar -->
    <header class="flex items-center justify-between bg-white px-3 py-2 rounded-lg border border-slate-200 shadow-sm">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded bg-indigo-600 text-white flex items-center justify-center font-bold text-xs">
          <i class="fa-solid fa-users"></i>
        </div>
        <h1 class="text-sm font-bold text-slate-900 leading-none">Family Count & Guest Tracker</h1>
      </div>
      
      <!-- Side View Switcher -->
      <div class="flex items-center gap-2">
        <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-300 rounded px-2 py-0.5">
          <label class="text-[11px] font-bold text-slate-600">View Side:</label>
          <select id="sideViewFilter" onchange="onSideFilterChange(this.value)" class="text-xs font-semibold bg-transparent text-indigo-700 outline-none cursor-pointer">
            <option value="All">All Families</option>
            <option value="Paternal">Paternal Side</option>
            <option value="Maternal">Maternal Side</option>
          </select>
        </div>
        <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-900 text-white text-[11px] font-semibold px-2.5 py-1 rounded transition flex items-center gap-1">
          <i class="fa-solid fa-print"></i> Print
        </button>
      </div>
    </header>

    <!-- Compact Summary Strip -->
    <div class="grid grid-cols-2 md:grid-cols-6 gap-2">
      <div class="bg-indigo-900 text-white px-3 py-1.5 rounded-lg shadow-sm">
        <span class="text-[10px] font-bold uppercase tracking-wider text-indigo-200 block" id="summaryTitle">All Families</span>
        <div class="flex items-baseline gap-1">
          <span id="statComing" class="text-xl font-black text-emerald-300">0</span>
          <span class="text-[10px] text-indigo-200">coming</span>
        </div>
      </div>
      <div class="bg-white border border-slate-200 px-3 py-1.5 rounded-lg shadow-sm">
        <span class="text-[10px] font-bold uppercase text-slate-400 block">Total Headcount</span>
        <span id="statTotal" class="text-base font-bold text-slate-800 block">0</span>
      </div>
      <div class="bg-blue-50/50 border border-blue-100 px-3 py-1.5 rounded-lg shadow-sm">
        <span class="text-[10px] font-bold uppercase text-blue-600 block">Gents</span>
        <span id="statGents" class="text-base font-bold text-blue-700 block">0</span>
      </div>
      <div class="bg-pink-50/50 border border-pink-100 px-3 py-1.5 rounded-lg shadow-sm">
        <span class="text-[10px] font-bold uppercase text-pink-600 block">Ladies</span>
        <span id="statLadies" class="text-base font-bold text-pink-700 block">0</span>
      </div>
      <div class="bg-amber-50/50 border border-amber-100 px-3 py-1.5 rounded-lg shadow-sm">
        <span class="text-[10px] font-bold uppercase text-amber-600 block">Kids</span>
        <span id="statKids" class="text-base font-bold text-amber-700 block">0</span>
      </div>
      <div class="bg-emerald-50/50 border border-emerald-100 px-3 py-1.5 rounded-lg shadow-sm">
        <span class="text-[10px] font-bold uppercase text-emerald-600 block">Invited Count</span>
        <span id="statInvited" class="text-base font-bold text-emerald-700 block">0 Fam</span>
      </div>
    </div>

    <!-- Single-Row Compact Entry Form -->
    <div class="bg-white p-2.5 rounded-lg border border-slate-200 shadow-sm">
      <form id="familyForm" onsubmit="handleFormSubmit(event)" class="space-y-1.5">
        <input type="hidden" id="docId" value="" />
        
        <!-- Row 1: Basic Identifiers -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-12 gap-1.5">
          <div class="md:col-span-2">
            <select id="side" class="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs font-semibold text-slate-700 focus:outline-none focus:border-indigo-500">
              <option value="Paternal">Paternal Side</option>
              <option value="Maternal">Maternal Side</option>
            </select>
          </div>

          <div class="md:col-span-3">
            <div class="flex gap-1">
              <select id="relationSelect" onchange="checkCustomRelation(this.value)" class="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs font-semibold text-slate-700 focus:outline-none focus:border-indigo-500">
                <option value="Babai / Chacha">Babai / Chacha</option>
                <option value="Peddananna / Tauji">Peddananna / Tauji</option>
                <option value="Mama / Uncle">Mama / Uncle</option>
                <option value="Atta / Bua / Mami">Atta / Bua / Mami</option>
                <option value="Annaya / Bhaiya">Annaya / Bhaiya</option>
                <option value="Thammudu / Younger Bro">Thammudu / Bro</option>
                <option value="Akka / Didi">Akka / Didi</option>
                <option value="Chelli / Younger Sis">Chelli / Sis</option>
                <option value="Bava / Jiju">Bava / Jiju</option>
                <option value="Cousin">Cousin</option>
                <option value="Friend">Friend</option>
                <option value="__custom__">+ Custom Relation...</option>
              </select>
              <input type="text" id="customRelationInput" placeholder="Enter Relation" class="hidden w-full bg-white border border-indigo-400 rounded px-2 py-1 text-xs font-semibold focus:outline-none" />
            </div>
          </div>

          <div class="md:col-span-3">
            <input type="text" id="familyName" required placeholder="Family / Head Name *" class="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs focus:outline-none focus:border-indigo-500" />
          </div>

          <div class="md:col-span-2">
            <input type="text" id="familyPlace" placeholder="Place (e.g. Hyd)" class="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs focus:outline-none focus:border-indigo-500" />
          </div>

          <div class="md:col-span-2">
            <input type="tel" id="familyPhone" placeholder="Phone Number" class="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs focus:outline-none focus:border-indigo-500" />
          </div>
        </div>

        <!-- Row 2: Direct G, L, K Numbers + Optional Kid Names -->
        <div class="grid grid-cols-2 md:grid-cols-12 gap-1.5 items-center">
          <div class="col-span-1 md:col-span-1 flex items-center gap-1 bg-slate-50 border border-slate-300 rounded px-1.5 py-0.5">
            <span class="text-[10px] font-bold text-blue-700">G:</span>
            <input type="number" id="gentsCount" min="0" value="1" required class="w-full text-center bg-transparent text-xs font-bold focus:outline-none" />
          </div>

          <div class="col-span-1 md:col-span-1 flex items-center gap-1 bg-slate-50 border border-slate-300 rounded px-1.5 py-0.5">
            <span class="text-[10px] font-bold text-pink-700">L:</span>
            <input type="number" id="ladiesCount" min="0" value="1" required class="w-full text-center bg-transparent text-xs font-bold focus:outline-none" />
          </div>

          <div class="col-span-1 md:col-span-1 flex items-center gap-1 bg-slate-50 border border-slate-300 rounded px-1.5 py-0.5">
            <span class="text-[10px] font-bold text-amber-700">K:</span>
            <input type="number" id="kidsCount" min="0" value="0" required class="w-full text-center bg-transparent text-xs font-bold focus:outline-none" />
          </div>

          <div class="col-span-1 md:col-span-4">
            <input type="text" id="kidNames" placeholder="Kid names (e.g. Aryan, Riya) - optional" class="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs focus:outline-none focus:border-indigo-500" />
          </div>

          <div class="col-span-1 md:col-span-3">
            <input type="text" id="notes" placeholder="Remarks / Notes" class="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs focus:outline-none focus:border-indigo-500" />
          </div>

          <div class="col-span-2 md:col-span-2 flex gap-1">
            <button type="submit" id="saveBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-1 rounded transition shadow-sm">
              Add
            </button>
            <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden px-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold py-1 rounded transition">
              ✕
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- Search & Search Filter -->
    <div class="flex items-center justify-between gap-2 px-0.5">
      <span id="tableCountLabel" class="text-xs font-bold text-slate-600">Showing 0 entries</span>
      <input type="text" id="searchInput" oninput="renderTable()" placeholder="Search name, relation, place..." class="bg-white border border-slate-300 text-xs px-2 py-1 rounded-lg w-48 md:w-64 focus:outline-none" />
    </div>

    <!-- Flat Compact Table -->
    <div class="bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-bold uppercase text-[11px]">
              <th class="py-2 px-2.5">Side</th>
              <th class="py-2 px-2.5">Relation</th>
              <th class="py-2 px-2.5">Family Name & Place</th>
              <th class="py-2 px-1.5 text-center text-blue-700">G</th>
              <th class="py-2 px-1.5 text-center text-pink-700">L</th>
              <th class="py-2 px-1.5 text-center text-amber-700">K</th>
              <th class="py-2 px-1.5 text-center font-bold text-slate-500">Total</th>
              <th class="py-2 px-2.5 text-center">Invitation</th>
              <th class="py-2 px-2.5 text-center bg-emerald-50/50 text-emerald-800">Coming Count</th>
              <th class="py-2 px-2 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="familyTableBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
      <p id="emptyMessage" class="hidden text-center py-4 text-slate-400 text-xs">No entries found.</p>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDbMtnm-PXJfs1ZEobc-lxu7T1yjFSjtUg",
      authDomain: "familycount-c6860.firebaseapp.com",
      databaseURL: "https://familycount-c6860-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "familycount-c6860",
      storageBucket: "familycount-c6860.firebasestorage.app",
      messagingSenderId: "206416370169",
      appId: "1:206416370169:web:27e5cf09964244326cc528",
      measurementId: "G-13PFL67Q6B"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const collectionRef = db.collection("family_count");

    let families = [];
    let currentSideFilter = 'All';

    collectionRef.onSnapshot((snapshot) => {
      families = [];
      snapshot.forEach((doc) => {
        families.push({ id: doc.id, ...doc.data() });
      });
      renderDashboard();
      renderTable();
    });

    function onSideFilterChange(val) {
      currentSideFilter = val;
      renderDashboard();
      renderTable();
    }

    function checkCustomRelation(val) {
      const customInput = document.getElementById('customRelationInput');
      const select = document.getElementById('relationSelect');
      if (val === '__custom__') {
        select.classList.add('hidden');
        customInput.classList.remove('hidden');
        customInput.focus();
      }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const docId = document.getElementById('docId').value;
      
      const customInput = document.getElementById('customRelationInput');
      const select = document.getElementById('relationSelect');
      let finalRelation = (!customInput.classList.contains('hidden') && customInput.value.trim()) 
        ? customInput.value.trim() 
        : select.value;

      const record = {
        side: document.getElementById('side').value,
        relation: finalRelation,
        name: document.getElementById('familyName').value.trim(),
        place: document.getElementById('familyPlace').value.trim(),
        phone: document.getElementById('familyPhone').value.trim(),
        gents: parseInt(document.getElementById('gentsCount').value) || 0,
        ladies: parseInt(document.getElementById('ladiesCount').value) || 0,
        kids: parseInt(document.getElementById('kidsCount').value) || 0,
        kidNames: document.getElementById('kidNames').value.trim(),
        notes: document.getElementById('notes').value.trim(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      if (!docId) {
        record.invitation = "Not Invited";
        record.comingCount = 0;
      }

      if (docId) {
        await collectionRef.doc(docId).update(record);
      } else {
        await collectionRef.add(record);
      }

      resetForm();
    }

    async function updateInvitation(id, val) {
      const item = families.find(f => f.id === id);
      const totalFamily = (item.gents || 0) + (item.ladies || 0) + (item.kids || 0);
      
      let updatePayload = {
        invitation: val,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      if (val === 'Invited' && (!item.comingCount || item.comingCount === 0)) {
        updatePayload.comingCount = totalFamily;
      } else if (val === 'Not Invited') {
        updatePayload.comingCount = 0;
      }

      await collectionRef.doc(id).update(updatePayload);
    }

    async function updateComingCount(id, val) {
      const count = parseInt(val) || 0;
      await collectionRef.doc(id).update({
        comingCount: count,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    function editEntry(id) {
      const item = families.find(f => f.id === id);
      if (!item) return;

      document.getElementById('docId').value = item.id;
      document.getElementById('side').value = item.side || 'Paternal';
      
      const select = document.getElementById('relationSelect');
      const customInput = document.getElementById('customRelationInput');
      
      let optionExists = false;
      for (let opt of select.options) {
        if (opt.value === item.relation) {
          optionExists = true;
          break;
        }
      }

      if (optionExists) {
        select.value = item.relation;
        select.classList.remove('hidden');
        customInput.classList.add('hidden');
      } else {
        select.classList.add('hidden');
        customInput.classList.remove('hidden');
        customInput.value = item.relation || '';
      }

      document.getElementById('familyName').value = item.name;
      document.getElementById('familyPlace').value = item.place || '';
      document.getElementById('familyPhone').value = item.phone || '';
      document.getElementById('gentsCount').value = item.gents || 0;
      document.getElementById('ladiesCount').value = item.ladies || 0;
      document.getElementById('kidsCount').value = item.kids || 0;
      document.getElementById('kidNames').value = item.kidNames || '';
      document.getElementById('notes').value = item.notes || '';

      document.getElementById('saveBtn').textContent = 'Update';
      document.getElementById('cancelBtn').classList.remove('hidden');
    }

    async function deleteEntry(id) {
      const item = families.find(f => f.id === id);
      if (confirm(`Delete ${item ? item.name : 'this family'}?`)) {
        await collectionRef.doc(id).delete();
      }
    }

    function resetForm() {
      document.getElementById('familyForm').reset();
      document.getElementById('docId').value = '';
      document.getElementById('gentsCount').value = 1;
      document.getElementById('ladiesCount').value = 1;
      document.getElementById('kidsCount').value = 0;
      
      const select = document.getElementById('relationSelect');
      const customInput = document.getElementById('customRelationInput');
      select.classList.remove('hidden');
      select.selectedIndex = 0;
      customInput.classList.add('hidden');
      customInput.value = '';

      document.getElementById('saveBtn').textContent = 'Add';
      document.getElementById('cancelBtn').classList.add('hidden');
    }

    function renderDashboard() {
      const targetFamilies = (currentSideFilter === 'All') 
        ? families 
        : families.filter(f => f.side === currentSideFilter);

      let gCount = 0, lCount = 0, kCount = 0, comingCount = 0, invitedFamCount = 0;

      targetFamilies.forEach(f => {
        const g = f.gents || 0;
        const l = f.ladies || 0;
        const k = f.kids || 0;
        const coming = parseInt(f.comingCount) || 0;

        gCount += g;
        lCount += l;
        kCount += k;
        comingCount += coming;
        if (f.invitation === 'Invited') invitedFamCount++;
      });

      document.getElementById('summaryTitle').textContent = currentSideFilter === 'All' ? 'All Families' : `${currentSideFilter} Side`;
      document.getElementById('statComing').textContent = comingCount;
      document.getElementById('statTotal').textContent = gCount + lCount + kCount;
      document.getElementById('statGents').textContent = gCount;
      document.getElementById('statLadies').textContent = lCount;
      document.getElementById('statKids').textContent = kCount;
      document.getElementById('statInvited').textContent = `${invitedFamCount} / ${targetFamilies.length}`;
    }

    function renderTable() {
      const tbody = document.getElementById('familyTableBody');
      const search = document.getElementById('searchInput').value.toLowerCase();
      tbody.innerHTML = '';

      const filtered = families.filter(f => {
        const matchesSide = (currentSideFilter === 'All') || (f.side === currentSideFilter);
        const matchesSearch = (f.name && f.name.toLowerCase().includes(search)) || 
                              (f.relation && f.relation.toLowerCase().includes(search)) || 
                              (f.place && f.place.toLowerCase().includes(search)) || 
                              (f.phone && f.phone.includes(search)) || 
                              (f.kidNames && f.kidNames.toLowerCase().includes(search)) ||
                              (f.notes && f.notes.toLowerCase().includes(search));
        return matchesSide && matchesSearch;
      });

      document.getElementById('tableCountLabel').textContent = `Showing ${filtered.length} entries`;

      if (filtered.length === 0) {
        document.getElementById('emptyMessage').classList.remove('hidden');
      } else {
        document.getElementById('emptyMessage').classList.add('hidden');
      }

      filtered.forEach(item => {
        const total = (item.gents || 0) + (item.ladies || 0) + (item.kids || 0);
        const isPat = (item.side !== 'Maternal');
        const isInvited = (item.invitation === 'Invited');
        const comingCount = (item.comingCount !== undefined) ? item.comingCount : 0;

        const inviteSelect = `
          <select onchange="updateInvitation('${item.id}', this.value)" class="text-[11px] font-semibold px-1.5 py-0.5 rounded border focus:outline-none ${
            isInvited ? 'bg-emerald-50 text-emerald-800 border-emerald-300' : 'bg-slate-50 text-slate-600 border-slate-300'
          }">
            <option value="Not Invited" ${!isInvited ? 'selected' : ''}>⏳ Not Invited</option>
            <option value="Invited" ${isInvited ? 'selected' : ''}>📩 Invited</option>
          </select>
        `;

        const comingInput = `
          <div class="flex items-center justify-center gap-1">
            <input type="number" min="0" max="${total}" value="${comingCount}" 
              onchange="updateComingCount('${item.id}', this.value)"
              class="w-11 text-center text-xs font-bold py-0.5 rounded border ${
                comingCount > 0 ? 'bg-emerald-50 text-emerald-800 border-emerald-400' : 'bg-slate-50 text-slate-400 border-slate-300'
              } focus:outline-none" />
            <span class="text-[10px] text-slate-400">/ ${total}</span>
          </div>
        `;

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50 transition';
        tr.innerHTML = `
          <td class="py-1.5 px-2.5">
            <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${isPat ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800'}">
              ${isPat ? 'Paternal' : 'Maternal'}
            </span>
          </td>
          <td class="py-1.5 px-2.5 font-medium text-slate-700 text-xs">${item.relation || '—'}</td>
          <td class="py-1.5 px-2.5">
            <div class="font-semibold text-slate-800 text-xs leading-tight">${item.name}</div>
            <div class="text-[10px] text-slate-400 flex items-center gap-2">
              ${item.place ? `<span><i class="fa-solid fa-location-dot mr-0.5"></i>${item.place}</span>` : ''}
              ${item.phone ? `<span><i class="fa-solid fa-phone mr-0.5"></i>${item.phone}</span>` : ''}
            </div>
            ${item.kidNames ? `<div class="text-[10px] text-amber-700 mt-0.5"><i class="fa-solid fa-child text-[9px] mr-1"></i>${item.kidNames}</div>` : ''}
            ${item.notes ? `<div class="text-[10px] text-indigo-500 italic mt-0.5">${item.notes}</div>` : ''}
          </td>
          <td class="py-1.5 px-1.5 text-center text-slate-700 font-medium">${item.gents || 0}</td>
          <td class="py-1.5 px-1.5 text-center text-slate-700 font-medium">${item.ladies || 0}</td>
          <td class="py-1.5 px-1.5 text-center text-amber-700 font-bold">${item.kids || 0}</td>
          <td class="py-1.5 px-1.5 text-center font-bold text-slate-600">${total}</td>
          <td class="py-1.5 px-2.5 text-center">${inviteSelect}</td>
          <td class="py-1.5 px-2.5 text-center bg-emerald-50/20">${comingInput}</td>
          <td class="py-1.5 px-2 text-right">
            <button onclick="editEntry('${item.id}')" class="text-slate-400 hover:text-indigo-600 px-1" title="Edit"><i class="fa-solid fa-pen"></i></button>
            <button onclick="deleteEntry('${item.id}')" class="text-slate-400 hover:text-rose-600 px-1" title="Delete"><i class="fa-solid fa-trash"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
