<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Party Tracker - Food Planning</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}.meal-card{border:1px solid #dbe3ee;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.meal-head{width:100%;border:0;display:flex;align-items:center;justify-content:space-between;padding:9px 11px;cursor:pointer;font-weight:900}.meal-body{padding:9px}.hidden-body{display:none}
.meal-title{display:flex;align-items:center;gap:7px;font-size:12px}.meal-icon{width:27px;height:27px;border-radius:8px;display:flex;align-items:center;justify-content:center}.meal-summary{display:flex;align-items:center;gap:6px}.guest-pill{border:1px solid #dbe3ee;background:#fff;border-radius:999px;padding:4px 8px;font-size:9px;font-weight:900}.chev{font-size:9px;transition:.15s}.open .chev{transform:rotate(90deg)}
.breakfast .meal-head{background:#fffbeb;color:#92400e}.lunch .meal-head{background:#fff7ed;color:#c2410c}.snacks .meal-head{background:#fdf2f8;color:#9d174d}.dinner .meal-head{background:#eef2ff;color:#3730a3}
.meal-chip{border:1px solid;border-radius:11px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:7px}.meal-chip span{font-size:9px;font-weight:900}.meal-chip b{font-size:16px}.chip-breakfast{background:#fffbeb;border-color:#fde68a;color:#92400e}.chip-lunch{background:#fff7ed;border-color:#fed7aa;color:#c2410c}.chip-snacks{background:#fdf2f8;border-color:#fbcfe8;color:#9d174d}.chip-dinner{background:#eef2ff;border-color:#c7d2fe;color:#3730a3}
.food-table{width:100%;border-collapse:collapse;min-width:540px}.food-table th,.food-table td{border:1px solid #e2e8f0;padding:5px 6px;font-size:9px}.food-table th{background:#f8fafc;color:#64748b;text-transform:uppercase;font-size:8px;text-align:left}.food-table td:first-child{width:145px;font-weight:900;color:#475569}.food-input,.food-qty{width:100%;border:1px solid #cbd5e1;border-radius:7px;padding:5px 7px;font-size:10px;outline:0;background:#fff}.food-qty{width:70px;text-align:center;font-weight:800}.btn{border:1px solid #cbd5e1;border-radius:7px;padding:4px 7px;font-size:9px;font-weight:900;background:#fff}.btn:hover{background:#f8fafc}.btn-add{border-color:#a7f3d0;background:#ecfdf5;color:#047857}.btn-save{border-color:#a7f3d0;background:#059669;color:#fff}.btn-danger{color:#be123c}.btn-edit{color:#4f46e5}.cat-tools{white-space:nowrap;text-align:right}.guest-box{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px;border:1px solid #dbe3ee;border-radius:9px;background:#f8fafc;margin-bottom:8px}.guest-box input{width:82px;border:1px solid #cbd5e1;border-radius:7px;padding:5px;text-align:center;font-size:10px;font-weight:900}.status{font-size:9px;font-weight:800;color:#64748b}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.topbar{position:relative}.countdown{position:absolute;left:50%;transform:translateX(-50%);top:8px;width:72px;height:72px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff7ed;border:4px solid #fed7aa;color:#c2410c;box-shadow:0 3px 10px rgba(15,23,42,.08)}
@media(max-width:650px){.countdown{position:static;transform:none;width:62px;height:62px;margin:7px auto}.topbar{display:flex;flex-direction:column}.food-table{min-width:500px}}
</style>
</head>
<body class="bg-slate-100 text-slate-800 p-2 sm:p-3 min-h-screen">
<div id="loginScreen" class="fixed inset-0 z-50 bg-slate-900/80 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-sm">
    <div class="text-center mb-4"><div class="mx-auto w-12 h-12 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xl"><i class="fa-solid fa-utensils"></i></div><h1 class="font-black text-lg mt-2">Food Planning</h1><p class="text-xs text-slate-500">Use your existing Party Tracker family code.</p></div>
    <form onsubmit="login(event)" class="space-y-3"><input id="codeInput" required maxlength="6" class="w-full border rounded-lg px-3 py-2.5 text-center tracking-widest font-black uppercase" placeholder="FAMILY CODE"><button class="w-full bg-emerald-600 text-white rounded-lg py-2.5 text-xs font-black">Login</button></form>
    <p id="loginError" class="hidden text-xs text-rose-600 font-bold mt-3"></p>
  </div>
</div>
<div id="app" class="hidden max-w-5xl mx-auto space-y-2.5">
  <header class="topbar bg-slate-900 text-white rounded-2xl px-3 sm:px-4 py-3 shadow-sm">
    <div class="flex items-center justify-between gap-3"><div><div class="text-sm font-black"><i class="fa-solid fa-utensils text-emerald-300 mr-1"></i> Food Planning</div><div id="familyLabel" class="text-[9px] text-slate-300 mt-1"></div></div><button onclick="logout()" class="text-[9px] font-black text-slate-300 hover:text-white">Logout</button></div>
    <div id="countdown" class="countdown"><i class="fa-regular fa-calendar"></i><b id="daysText" class="text-sm mt-1">—</b><span id="daysLabel" class="text-[7px] font-black uppercase">Set Date</span></div>
    <div class="mt-3 pt-2 border-t border-slate-700"><label class="block text-[9px] uppercase font-black text-slate-300 mb-1">Event Function</label><select id="functionSelect" onchange="changeFunction(this.value)" class="w-full sm:max-w-md bg-white text-slate-800 border-0 rounded-lg px-3 py-2 text-xs font-black"></select></div>
  </header>
  <div id="mealChips" class="grid grid-cols-2 md:grid-cols-4 gap-2"></div>
  <div class="bg-white border border-slate-200 rounded-xl p-2.5 flex flex-wrap items-center justify-between gap-2"><div><div class="text-xs font-black">Food Menu</div><div class="status">Add, rename or delete categories independently for each meal.</div></div><div class="flex gap-1.5"><button class="btn" onclick="collapseAll()"><i class="fa-solid fa-compress"></i> Collapse</button><button class="btn btn-add" onclick="expandAll()"><i class="fa-solid fa-expand"></i> Expand</button><button class="btn btn-save" onclick="saveAll()"><i class="fa-solid fa-cloud-arrow-up"></i> Save</button></div></div>
  <div id="meals" class="grid grid-cols-1 md:grid-cols-2 gap-2.5"></div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyDbMtnm-PXJfs1ZEobc-lxu7T1yjFSjtUg",authDomain:"familycount-c6860.firebaseapp.com",databaseURL:"https://familycount-c6860-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"familycount-c6860",storageBucket:"familycount-c6860.firebasestorage.app",messagingSenderId:"206416370169",appId:"1:206416370169:web:27e5cf09964244326cc528",measurementId:"G-13PFL67Q6B"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore(), familyRef=db.collection('family_count'), foodRef=db.collection('food_plans');
const meals=['breakfast','lunch','snacks','dinner'];
const meta={breakfast:{label:'Breakfast',icon:'fa-mug-hot',chip:'chip-breakfast'},lunch:{label:'Lunch',icon:'fa-bowl-food',chip:'chip-lunch'},snacks:{label:'Snacks',icon:'fa-cookie-bite',chip:'chip-snacks'},dinner:{label:'Dinner',icon:'fa-utensils',chip:'chip-dinner'}};
const defaults={breakfast:[['hot','Hot Breakfast'],['tiffin','Snacks / Tiffin'],['breads','Breads'],['sides','Sides'],['chutney','Chutney / Pickle'],['beverages','Beverages'],['dessert','Fruit / Dessert']],lunch:[['starters','Starters'],['main','Main Course'],['rice','Rice / Biryani'],['breads','Breads'],['sides','Sides'],['pickles','Pickles'],['raita','Raita / Salad'],['dessert','Dessert'],['beverages','Beverages']],snacks:[['savouries','Savouries'],['chaat','Chaats / Chutneys'],['sweets','Sweets'],['bakery','Bakery'],['fruit','Fruit'],['hotbev','Hot Beverages'],['coldbev','Cold Beverages']],dinner:[['starters','Starters'],['main','Main Course'],['rice','Rice / Biryani'],['breads','Breads'],['sides','Sides'],['pickles','Pickles'],['raita','Raita / Salad'],['dessert','Dessert'],['beverages','Beverages']]};
let code=localStorage.getItem('fc_user_code')||'', functions=[], functionDates={}, selected=localStorage.getItem('fc_food_function')||'', categories={}, plan={}, openMeals=new Set();
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function defaultCats(){const o={};meals.forEach(m=>o[m]=defaults[m].map(x=>({id:x[0],label:x[1]})));return o;}
function normalizeCats(raw){const d=defaultCats();if(!raw||typeof raw!=='object')return d;const o={};meals.forEach(m=>{const arr=Array.isArray(raw[m])?raw[m]:[];o[m]=arr.map((x,i)=>{if(typeof x==='string')return{id:'c_'+i,label:x};return{id:String(x.id||('c_'+i)),label:String(x.label||x.name||'').trim()};}).filter(x=>x.label);if(!o[m].length)o[m]=d[m];});return o;}
async function login(e){e.preventDefault();const c=document.getElementById('codeInput').value.trim().toUpperCase();if(!c)return;try{const snap=await familyRef.where('code','==',c).get();if(snap.empty){showErr('Invalid family code.');return;}let blocked=false;snap.forEach(d=>{if(d.data().isBlocked===true)blocked=true});if(blocked){showErr('This family code is locked by the administrator.');return;}code=c;localStorage.setItem('fc_user_code',code);await boot();}catch(err){showErr(err.message||'Unable to login.');}}
function showErr(t){const e=document.getElementById('loginError');e.textContent=t;e.classList.remove('hidden');}
function logout(){localStorage.removeItem('fc_user_code');location.reload();}
async function boot(){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('familyLabel').textContent='Family Code: '+code;await loadMeta();await loadHeadcounts();await loadPlan();render();}
async function loadMeta(){try{const d=await familyRef.doc('__meta__GLOBAL').get();const x=d.exists?d.data():{};functions=Array.isArray(x.functions)?x.functions.map(String).filter(Boolean):[];if(!functions.length)functions=['All'];functionDates=x.functionDates&&typeof x.functionDates==='object'?x.functionDates:{};categories=normalizeCats(x.foodCategories);}catch(e){console.error(e);functions=['All'];categories=defaultCats();}}
async function loadHeadcounts(){/* Guest counts are intentionally editable per meal; no forced plan/actual dependency. */}
function storageId(){return (code+'__'+(selected||'All')).replace(/[^A-Za-z0-9_-]/g,'_');}
async function loadPlan(){plan={};try{const d=await foodRef.doc(storageId()).get();if(d.exists&&d.data().foodPlan)plan=normalizePlan(d.data().foodPlan);}catch(e){console.error(e);}}
function normalizePlan(raw){const o={};meals.forEach(m=>{const d=raw?.[m]||{};o[m]={guestCount:d.guestCount??'',categories:{}};(categories[m]||[]).forEach(c=>{o[m].categories[c.id]=d.categories?.[c.id]||{menu:'',qty:''};});});return o;}
function render(){renderFunctions();renderChips();renderMeals();updateCountdown();}
function renderFunctions(){const s=document.getElementById('functionSelect');if(!functions.length)functions=['All'];if(!selected||(!functions.includes(selected)&&selected!=='All'))selected=functions[0]||'All';s.innerHTML=functions.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join('');s.value=selected;localStorage.setItem('fc_food_function',selected);}
function guestValue(m){const v=Number(plan?.[m]?.guestCount);return Number.isFinite(v)&&v>=0?v:'';}
function renderChips(){document.getElementById('mealChips').innerHTML=meals.map(m=>`<div class="meal-chip ${meta[m].chip}"><span><i class="fa-solid ${meta[m].icon} mr-1"></i>${meta[m].label}</span><b>${esc(guestValue(m))||'0'}</b></div>`).join('');}
function renderMeals(){const root=document.getElementById('meals');root.innerHTML=meals.map(m=>{const d=plan[m]||{guestCount:'',categories:{}};const rows=(categories[m]||[]).map(c=>{const x=d.categories?.[c.id]||{};return `<tr><td>${esc(c.label)}</td><td><input class="food-input" id="menu_${m}_${esc(c.id)}" value="${esc(x.menu||'')}" placeholder="Enter menu items..."></td><td><input class="food-qty" id="qty_${m}_${esc(c.id)}" type="number" min="0" step="any" value="${esc(x.qty??'')}" placeholder="0"></td><td class="cat-tools"><button class="btn btn-edit" onclick="renameCat('${m}','${esc(c.id)}')" title="Rename"><i class="fa-solid fa-pen"></i></button> <button class="btn btn-danger" onclick="deleteCat('${m}','${esc(c.id)}')" title="Delete"><i class="fa-solid fa-trash"></i></button></td></tr>`}).join('');return `<section class="meal-card ${m} ${openMeals.has(m)?'open':''}" id="meal_${m}"><button class="meal-head" onclick="toggleMeal('${m}')"><span class="meal-title"><span class="meal-icon bg-white/80"><i class="fa-solid ${meta[m].icon}"></i></span>${meta[m].label}</span><span class="meal-summary"><span class="guest-pill">${esc(guestValue(m))||0} Guests</span><i class="fa-solid fa-chevron-right chev"></i></span></button><div class="meal-body ${openMeals.has(m)?'':'hidden-body'}"><div class="guest-box"><label class="text-[9px] font-black text-slate-600"><i class="fa-solid fa-users text-emerald-600 mr-1"></i>Guests to Serve</label><input id="guest_${m}" type="number" min="0" step="any" value="${esc(guestValue(m))}" oninput="setGuest('${m}',this.value)"></div><div class="overflow-x-auto border rounded-lg"><table class="food-table"><thead><tr><th>Category</th><th>Menu Items</th><th>Qty</th><th>Action</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="text-center text-slate-400">No categories</td></tr>'}</tbody></table></div><div class="mt-2 flex justify-end"><button class="btn btn-add" onclick="addCat('${m}')"><i class="fa-solid fa-plus"></i> Add Category</button></div></div></section>`}).join('');}
function toggleMeal(m){captureMeal(m);openMeals.has(m)?openMeals.delete(m):openMeals.add(m);renderMeals();}
function captureMeal(m){if(!plan[m])plan[m]={guestCount:'',categories:{}};const g=document.getElementById('guest_'+m);if(g)plan[m].guestCount=g.value; (categories[m]||[]).forEach(c=>{const mi=document.getElementById(`menu_${m}_${c.id}`),qi=document.getElementById(`qty_${m}_${c.id}`);plan[m].categories[c.id]={menu:mi?.value||'',qty:qi?.value||''};});}
function captureAll(){meals.forEach(captureMeal);}
function setGuest(m,v){if(!plan[m])plan[m]={guestCount:'',categories:{}};plan[m].guestCount=v;const chip=document.querySelector(`.meal-chip.${meta[m].chip} b`);if(chip)chip.textContent=v||0;const card=document.getElementById('meal_'+m);const pill=card?.querySelector('.guest-pill');if(pill)pill.textContent=(v||0)+' Guests';}
function addCat(m){captureAll();const label=prompt('Category name:', 'New Category');if(!label)return;const clean=label.trim();if(!clean)return;if(categories[m].some(c=>c.label.toLowerCase()===clean.toLowerCase()))return alert('Category already exists.');categories[m].push({id:'cat_'+Date.now(),label:clean});renderMeals();saveCategories();}
function renameCat(m,id){captureAll();const c=categories[m].find(x=>x.id===id);if(!c)return;const n=prompt('Rename category:',c.label);if(n===null)return;const clean=n.trim();if(!clean)return;if(categories[m].some(x=>x.id!==id&&x.label.toLowerCase()===clean.toLowerCase()))return alert('Category already exists.');c.label=clean;renderMeals();saveCategories();}
function deleteCat(m,id){captureAll();const c=categories[m].find(x=>x.id===id);if(!c)return;if(!confirm('Delete "'+c.label+'"?'))return;categories[m]=categories[m].filter(x=>x.id!==id);if(plan[m]?.categories)delete plan[m].categories[id];renderMeals();saveCategories();}
async function saveCategories(){try{await familyRef.doc('__meta__GLOBAL').set({foodCategories:categories,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});}catch(e){alert('Unable to save category: '+(e.message||e));}}
async function saveAll(){captureAll();if(!selected||selected==='All'){alert('Select an Event Function before saving food planning.');return;}try{await foodRef.doc(storageId()).set({isFoodPlan:true,familyCode:code,eventFunction:selected,foodPlan:plan,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});alert('Food Planning saved for '+selected+'.');}catch(e){alert('Unable to save Food Planning: '+(e.message||e));}}
function collapseAll(){captureAll();openMeals.clear();renderMeals();}
function expandAll(){captureAll();openMeals=new Set(meals);renderMeals();}
function changeFunction(v){captureAll();selected=v;localStorage.setItem('fc_food_function',v);loadPlan().then(render);}
function updateCountdown(){const box=document.getElementById('countdown'),dt=String(functionDates?.[selected]||'').slice(0,10),days=document.getElementById('daysText'),label=document.getElementById('daysLabel');if(!dt){days.textContent='—';label.textContent='Set Date';box.title='Set the date in Party Tracker → Manage → Event Functions';return;}const d=new Date(dt+'T00:00:00'),today=new Date();today.setHours(0,0,0,0);const diff=Math.ceil((d-today)/86400000);if(diff>0){days.textContent=diff;label.textContent='Days to Go';}else if(diff===0){days.textContent='🎉';label.textContent='Today';}else{days.textContent=Math.abs(diff);label.textContent='Days Ago';}}
if(code){boot();}
</script>
</body>
</html>
