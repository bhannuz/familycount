<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Party Tracker - Food Planning</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}.meal-card{border:1px solid #dbe3ee;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.meal-head{width:100%;border:0;display:flex;align-items:center;justify-content:space-between;padding:9px 11px;cursor:pointer;font-weight:900}.meal-body{padding:9px}.hidden-body{display:none}
.meal-title{display:flex;align-items:center;gap:7px;font-size:12px}.meal-icon{width:27px;height:27px;border-radius:8px;display:flex;align-items:center;justify-content:center}.chev{font-size:9px;transition:.15s}.open .chev{transform:rotate(90deg)}
.breakfast .meal-head{background:#fffbeb;color:#92400e}.lunch .meal-head{background:#fff7ed;color:#c2410c}.snacks .meal-head{background:#fdf2f8;color:#9d174d}.dinner .meal-head{background:#eef2ff;color:#3730a3}
.food-table{width:100%;border-collapse:collapse;min-width:540px}.food-table th,.food-table td{border:1px solid #e2e8f0;padding:5px 6px;font-size:9px}.food-table th{background:#f8fafc;color:#64748b;text-transform:uppercase;font-size:8px;text-align:left}.food-table td:first-child{width:145px;font-weight:900;color:#475569}.food-input,.food-qty{width:100%;border:1px solid #cbd5e1;border-radius:7px;padding:5px 7px;font-size:10px;outline:0;background:#fff}.food-qty{width:70px;text-align:center;font-weight:800}.meal-manager{position:fixed;inset:0;background:rgba(15,23,42,.65);z-index:60;display:flex;align-items:center;justify-content:center;padding:12px}.meal-manager-card{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.25)}.meal-option{border:1px solid #dbe3ee;border-radius:10px;padding:8px 9px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#f8fafc}.meal-option input{width:16px;height:16px}.custom-meal-row{display:flex;gap:6px}.custom-meal-row input{flex:1;border:1px solid #cbd5e1;border-radius:7px;padding:6px 8px;font-size:10px}.custom-meal{background:#f0fdf4;border-color:#bbf7d0}border:1px solid #cbd5e1;border-radius:7px;padding:4px 7px;font-size:9px;font-weight:900;background:#fff}.btn:hover{background:#f8fafc}.btn-add{border-color:#a7f3d0;background:#ecfdf5;color:#047857}.btn-save{border-color:#a7f3d0;background:#059669;color:#fff}.btn-danger{color:#be123c}.btn-edit{color:#4f46e5}.cat-tools{white-space:nowrap;text-align:right}.status{font-size:9px;font-weight:800;color:#64748b}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.topbar{position:relative}.countdown{position:absolute;left:50%;transform:translateX(-50%);top:8px;width:72px;height:72px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff7ed;border:4px solid #fed7aa;color:#c2410c;box-shadow:0 3px 10px rgba(15,23,42,.08)}
@media(max-width:650px){.countdown{position:static;transform:none;width:62px;height:62px;margin:7px auto}.topbar{display:flex;flex-direction:column}.food-table{min-width:500px}}
</style>
</head>
<body class="bg-slate-100 text-slate-800 p-2 sm:p-3 min-h-screen">
<div id="loginScreen" class="fixed inset-0 z-50 bg-slate-900/80 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-sm">
    <div class="text-center mb-4"><div class="mx-auto w-12 h-12 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xl"><i class="fa-solid fa-utensils"></i></div><h1 class="font-black text-lg mt-2">Food Planning</h1><p class="text-xs text-slate-500">Use your existing Party Tracker family code.</p></div>
    <form onsubmit="login(event)" class="space-y-3"><input id="codeInput" required maxlength="6" class="w-full border rounded-lg px-3 py-2.5 text-center tracking-widest font-black uppercase" placeholder="FAMILY CODE"><button class="w-full bg-emerald-600 text-white rounded-lg py-2.5 text-xs font-black">Login</button></form>
    <p id="loginError" class="hidden text-xs text-rose-600 font-bold mt-3"></p>
  </div>
</div>
<div id="app" class="hidden max-w-5xl mx-auto space-y-2.5">
  <header class="topbar bg-slate-900 text-white rounded-2xl px-3 sm:px-4 py-3 shadow-sm">
    <div class="flex items-center justify-between gap-3"><div><div class="text-sm font-black"><i class="fa-solid fa-utensils text-emerald-300 mr-1"></i> Food Planning</div><div id="familyLabel" class="text-[9px] text-slate-300 mt-1"></div></div><button onclick="logout()" class="text-[9px] font-black text-slate-300 hover:text-white">Logout</button></div>
    <div id="countdown" class="countdown"><i class="fa-regular fa-calendar"></i><b id="daysText" class="text-sm mt-1">—</b><span id="daysLabel" class="text-[7px] font-black uppercase">Set Date</span></div>
    <div class="mt-3 pt-2 border-t border-slate-700"><label class="block text-[9px] uppercase font-black text-slate-300 mb-1">Event Function</label><select id="functionSelect" onchange="changeFunction(this.value)" class="w-full sm:max-w-md bg-white text-slate-800 border-0 rounded-lg px-3 py-2 text-xs font-black"></select></div>
  </header>
    <div class="bg-white border border-slate-200 rounded-xl p-2.5 flex flex-wrap items-center justify-between gap-2"><div><div class="text-xs font-black">Food Menu</div><div id="mealHint" class="status">Configure the meals required for this Event Function.</div></div><div class="flex flex-wrap gap-1.5"><button class="btn btn-add" onclick="openMealManager()"><i class="fa-solid fa-sliders"></i> Manage Meals</button><button class="btn" onclick="collapseAll()"><i class="fa-solid fa-compress"></i> Collapse</button><button class="btn btn-save" onclick="saveAll()"><i class="fa-solid fa-cloud-arrow-up"></i> Save</button></div></div>
  <div id="meals" class="grid grid-cols-1 md:grid-cols-2 gap-2.5"></div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyDbMtnm-PXJfs1ZEobc-lxu7T1yjFSjtUg",authDomain:"familycount-c6860.firebaseapp.com",databaseURL:"https://familycount-c6860-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"familycount-c6860",storageBucket:"familycount-c6860.firebasestorage.app",messagingSenderId:"206416370169",appId:"1:206416370169:web:27e5cf09964244326cc528",measurementId:"G-13PFL67Q6B"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore(), familyRef=db.collection('family_count'), foodRef=db.collection('food_plans');
const builtInMeals={
  breakfast:{label:'Breakfast',icon:'fa-mug-hot',head:'breakfast'},
  lunch:{label:'Lunch',icon:'fa-bowl-food',head:'lunch'},
  snacks:{label:'Snacks',icon:'fa-cookie-bite',head:'snacks'},
  dinner:{label:'Dinner',icon:'fa-utensils',head:'dinner'}
};
const defaultMealOrder=['breakfast','lunch','snacks','dinner'];
const defaults={
 breakfast:[['hot','Hot Breakfast'],['tiffin','Snacks / Tiffin'],['breads','Breads'],['sides','Sides'],['chutney','Chutney / Pickle'],['beverages','Beverages'],['dessert','Fruit / Dessert']],
 lunch:[['starters','Starters'],['main','Main Course'],['rice','Rice / Biryani'],['breads','Breads'],['sides','Sides'],['pickles','Pickles'],['raita','Raita / Salad'],['dessert','Dessert'],['beverages','Beverages']],
 snacks:[['savouries','Savouries'],['chaat','Chaats / Chutneys'],['sweets','Sweets'],['bakery','Bakery'],['fruit','Fruit'],['hotbev','Hot Beverages'],['coldbev','Cold Beverages']],
 dinner:[['starters','Starters'],['main','Main Course'],['rice','Rice / Biryani'],['breads','Breads'],['sides','Sides'],['pickles','Pickles'],['raita','Raita / Salad'],['dessert','Dessert'],['beverages','Beverages']]
};
let code=localStorage.getItem('fc_user_code')||'', functions=[], functionDates={}, selected=localStorage.getItem('fc_food_function')||'', categories={}, plan={}, activeMeals=[], openMeals=new Set();
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function defaultCatsFor(m){return (defaults[m]||[]).map(x=>({id:x[0],label:x[1]}));}
function normalizeCats(raw){
 const out={};
 if(raw&&typeof raw==='object') Object.keys(raw).forEach(m=>{if(Array.isArray(raw[m])) out[m]=raw[m].map((x,i)=>typeof x==='string'?{id:'c_'+i,label:x}:{id:String(x.id||('c_'+i)),label:String(x.label||x.name||'').trim()}).filter(x=>x.label);});
 return out;
}
function mealsForFunction(raw){
 const configured=raw?.mealsByFunction?.[selected];
 if(Array.isArray(configured)) return configured.filter(Boolean);
 if(raw?.foodMealsByFunction && Array.isArray(raw.foodMealsByFunction[selected])) return raw.foodMealsByFunction[selected].filter(Boolean);
 // Legacy plans that already contain meal data: show those meals.
 if(plan&&Object.keys(plan).some(k=>defaultMealOrder.includes(k))) return Object.keys(plan).filter(k=>defaultMealOrder.includes(k));
 return [];
}
async function login(e){e.preventDefault();const c=document.getElementById('codeInput').value.trim().toUpperCase();if(!c)return;try{const snap=await familyRef.where('code','==',c).get();if(snap.empty){showErr('Invalid family code.');return;}let blocked=false;snap.forEach(d=>{if(d.data().isBlocked===true)blocked=true});if(blocked){showErr('This family code is locked by the administrator.');return;}code=c;localStorage.setItem('fc_user_code',code);await boot();}catch(err){showErr(err.message||'Unable to login.');}}
function showErr(t){const e=document.getElementById('loginError');e.textContent=t;e.classList.remove('hidden');}
function logout(){localStorage.removeItem('fc_user_code');localStorage.removeItem('fc_food_function');location.reload();}
async function boot(){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('familyLabel').textContent='Family Code: '+code;await loadMeta();await selectInitialFunction();await loadPlan();render();}
async function loadMeta(){try{const d=await familyRef.doc('__meta__GLOBAL').get();const x=d.exists?d.data():{};functions=Array.isArray(x.functions)?x.functions.map(String).filter(Boolean):[];if(!functions.length)functions=['All'];functionDates=x.functionDates&&typeof x.functionDates==='object'?x.functionDates:{};categories=normalizeCats(x.foodCategories);if(!Object.keys(categories).length) categories={};window.metaGlobal=x;}catch(e){console.error(e);functions=['All'];categories={};window.metaGlobal={};}}
async function selectInitialFunction(){if(selected&&functions.includes(selected))return;const last=localStorage.getItem('fc_food_function');if(last&&functions.includes(last)){selected=last;return;}selected=functions.find(f=>f!=='All')||functions[0]||'All';localStorage.setItem('fc_food_function',selected);}
function storageId(){return (code+'__'+(selected||'All')).replace(/[^A-Za-z0-9_-]/g,'_');}
async function loadPlan(){plan={};try{const d=await foodRef.doc(storageId()).get();if(d.exists&&d.data().foodPlan)plan=normalizePlan(d.data().foodPlan);const rawMeta=window.metaGlobal||{};activeMeals=mealsForFunction(rawMeta);if(!activeMeals.length&&d.exists&&d.data().activeMeals)activeMeals=d.data().activeMeals;categories=mergeCategoriesForMeals(categories,activeMeals);plan=normalizePlan(plan);}catch(e){console.error(e);activeMeals=[];}}
function mergeCategoriesForMeals(raw,mealList){const out={};(mealList||[]).forEach(m=>{out[m]=Array.isArray(raw?.[m])&&raw[m].length?raw[m]:defaultCatsFor(m);});return out;}
function normalizePlan(raw){const o={};(activeMeals||[]).forEach(m=>{const d=raw?.[m]||{};o[m]={categories:{}};(categories[m]||[]).forEach(c=>{o[m].categories[c.id]=d.categories?.[c.id]||{menu:'',qty:''};});});return o;}
function render(){renderFunctions();renderMeals();updateCountdown();updateHint();}
function renderFunctions(){const s=document.getElementById('functionSelect');if(!functions.length)functions=['All'];if(!selected||!functions.includes(selected))selected=functions.find(f=>f!=='All')||functions[0]||'All';s.innerHTML=functions.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join('');s.value=selected;localStorage.setItem('fc_food_function',selected);}
function renderMeals(){const root=document.getElementById('meals');if(!activeMeals.length){root.innerHTML=`<div class="md:col-span-2 bg-white border border-dashed border-slate-300 rounded-xl p-6 text-center"><div class="text-sm font-black text-slate-700">No meal sections configured</div><div class="status mt-1">Use <b>Manage Meals</b> to add Breakfast, Lunch, Snacks, Dinner or your own meal section for ${esc(selected)}.</div><button class="btn btn-add mt-3" onclick="openMealManager()"><i class="fa-solid fa-plus"></i> Add Meal Section</button></div>`;return;}
 root.innerHTML=activeMeals.map(m=>{const info=builtInMeals[m]||{label:m,icon:'fa-utensils',head:'custom-meal'};const d=plan[m]||{categories:{}};const rows=(categories[m]||[]).map(c=>{const x=d.categories?.[c.id]||{};return `<tr><td>${esc(c.label)}</td><td><input class="food-input" id="menu_${esc(m)}_${esc(c.id)}" value="${esc(x.menu||'')}" placeholder="Enter menu items..."></td><td><input class="food-qty" id="qty_${esc(m)}_${esc(c.id)}" type="number" min="0" step="any" value="${esc(x.qty??'')}" placeholder="0"></td><td class="cat-tools"><button class="btn btn-edit" onclick="renameCat('${esc(m)}','${esc(c.id)}')" title="Rename"><i class="fa-solid fa-pen"></i></button> <button class="btn btn-danger" onclick="deleteCat('${esc(m)}','${esc(c.id)}')" title="Delete"><i class="fa-solid fa-trash"></i></button></td></tr>`}).join('');return `<section class="meal-card ${esc(info.head)} ${openMeals.has(m)?'open':''}" id="meal_${esc(m)}"><button class="meal-head" onclick="toggleMeal('${esc(m)}')"><span class="meal-title"><span class="meal-icon bg-white/80"><i class="fa-solid ${esc(info.icon)}"></i></span>${esc(info.label)}</span><span><i class="fa-solid fa-chevron-right chev"></i></span></button><div class="meal-body ${openMeals.has(m)?'':'hidden-body'}"><div class="overflow-x-auto border rounded-lg"><table class="food-table"><thead><tr><th>Category</th><th>Menu Items</th><th>Qty</th><th>Action</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="text-center text-slate-400">No categories</td></tr>'}</tbody></table></div><div class="mt-2 flex justify-end"><button class="btn btn-add" onclick="addCat('${esc(m)}')"><i class="fa-solid fa-plus"></i> Add Category</button></div></div></section>`}).join('');}
function updateHint(){const h=document.getElementById('mealHint');if(h)h.textContent=activeMeals.length?`${activeMeals.length} meal section${activeMeals.length===1?'':'s'} configured for ${selected}. Add, rename or delete categories inside each section.`:`No meal sections configured for ${selected}.`}
function toggleMeal(m){captureMeal(m);openMeals.has(m)?openMeals.delete(m):openMeals.add(m);renderMeals();}
function captureMeal(m){if(!activeMeals.includes(m))return;if(!plan[m])plan[m]={categories:{}};(categories[m]||[]).forEach(c=>{const mi=document.getElementById(`menu_${m}_${c.id}`),qi=document.getElementById(`qty_${m}_${c.id}`);plan[m].categories[c.id]={menu:mi?.value||'',qty:qi?.value||''};});}
function captureAll(){activeMeals.forEach(captureMeal);}
function addCat(m){captureAll();const label=prompt('Category name:','New Category');if(!label)return;const clean=label.trim();if(!clean)return;if((categories[m]||[]).some(c=>c.label.toLowerCase()===clean.toLowerCase()))return alert('Category already exists.');if(!categories[m])categories[m]=[];categories[m].push({id:'cat_'+Date.now(),label:clean});if(!plan[m])plan[m]={categories:{}};renderMeals();saveCategories();}
function renameCat(m,id){captureAll();const c=(categories[m]||[]).find(x=>x.id===id);if(!c)return;const n=prompt('Rename category:',c.label);if(n===null)return;const clean=n.trim();if(!clean)return;if((categories[m]||[]).some(x=>x.id!==id&&x.label.toLowerCase()===clean.toLowerCase()))return alert('Category already exists.');c.label=clean;renderMeals();saveCategories();}
function deleteCat(m,id){captureAll();const c=(categories[m]||[]).find(x=>x.id===id);if(!c)return;if(!confirm('Delete "'+c.label+'"?'))return;categories[m]=(categories[m]||[]).filter(x=>x.id!==id);if(plan[m]?.categories)delete plan[m].categories[id];renderMeals();saveCategories();}
async function saveCategories(){try{await familyRef.doc('__meta__GLOBAL').set({foodCategories:categories,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});}catch(e){alert('Unable to save category: '+(e.message||e));}}
async function saveAll(){captureAll();if(!selected||selected==='All'){alert('Select an Event Function before saving food planning.');return;}try{await foodRef.doc(storageId()).set({isFoodPlan:true,familyCode:code,eventFunction:selected,activeMeals:[...activeMeals],foodPlan:plan,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});await familyRef.doc('__meta__GLOBAL').set({foodMealsByFunction:{[selected]:[...activeMeals]},updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});if(window.metaGlobal)window.metaGlobal.foodMealsByFunction=window.metaGlobal.foodMealsByFunction||{};if(window.metaGlobal)window.metaGlobal.foodMealsByFunction[selected]=[...activeMeals];alert('Food Planning saved for '+selected+'.');}catch(e){alert('Unable to save Food Planning: '+(e.message||e));}}
function collapseAll(){captureAll();openMeals.clear();renderMeals();}
function expandAll(){captureAll();openMeals=new Set(activeMeals);renderMeals();}
function changeFunction(v){captureAll();selected=v;localStorage.setItem('fc_food_function',v);openMeals.clear();loadPlan().then(render);}
function openMealManager(){
 const old=document.getElementById('mealManager');if(old)old.remove();
 const built=defaultMealOrder.map(m=>{const info=builtInMeals[m];const checked=activeMeals.includes(m)?'checked':'';return `<label class="meal-option"><span class="flex items-center gap-2"><i class="fa-solid ${info.icon} text-slate-500"></i><span class="text-xs font-black">${info.label}</span></span><input type="checkbox" data-meal="${m}" ${checked}></label>`}).join('');
 const custom=activeMeals.filter(m=>!builtInMeals[m]).map(m=>`<div class="meal-option custom-meal"><span class="text-xs font-black">${esc(m)}</span><button class="btn btn-danger" onclick="removeCustomMeal('${esc(m)}')"><i class="fa-solid fa-trash"></i></button></div>`).join('');
 document.body.insertAdjacentHTML('beforeend',`<div id="mealManager" class="meal-manager"><div class="meal-manager-card"><div class="p-3 border-b flex items-center justify-between"><div><div class="text-sm font-black">Manage Meals</div><div class="status">Choose which meal sections are required for <b>${esc(selected)}</b>.</div></div><button class="btn" onclick="closeMealManager()"><i class="fa-solid fa-xmark"></i></button></div><div class="p-3 space-y-2"><div class="grid grid-cols-2 gap-2">${built}</div>${custom?`<div class="mt-3 space-y-2"><div class="status uppercase">Custom meal sections</div>${custom}</div>`:''}<div class="mt-3"><div class="status uppercase mb-1">Add custom meal</div><div class="custom-meal-row"><input id="newMealName" placeholder="e.g. High Tea, Brunch, Haldi Breakfast"><button class="btn btn-add" onclick="addCustomMeal()"><i class="fa-solid fa-plus"></i> Add</button></div></div></div><div class="p-3 border-t flex justify-end gap-2"><button class="btn" onclick="closeMealManager()">Cancel</button><button class="btn btn-save" onclick="applyMealManager()"><i class="fa-solid fa-check"></i> Apply</button></div></div></div>`);
}
function closeMealManager(){document.getElementById('mealManager')?.remove();}
function addCustomMeal(){const el=document.getElementById('newMealName');const n=el?.value.trim();if(!n)return;const id=n.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||('meal_'+Date.now());if(activeMeals.some(m=>m.toLowerCase()===id.toLowerCase()||m.toLowerCase()===n.toLowerCase()))return alert('Meal section already exists.');activeMeals.push(n);categories[n]=defaultCatsFor('lunch');plan[n]={categories:{}};closeMealManager();renderMeals();updateHint();saveMealConfiguration();}
function removeCustomMeal(m){if(!confirm('Remove '+m+' from this function? Its saved menu data will remain in Firestore but the section will be hidden.'))return;activeMeals=activeMeals.filter(x=>x!==m);openMeals.delete(m);closeMealManager();openMealManager();}
function applyMealManager(){const selectedBuilt=Array.from(document.querySelectorAll('#mealManager input[data-meal]:checked')).map(x=>x.dataset.meal);const custom=activeMeals.filter(m=>!builtInMeals[m]);activeMeals=[...defaultMealOrder.filter(m=>selectedBuilt.includes(m)),...custom];activeMeals.forEach(m=>{if(!categories[m]||!categories[m].length)categories[m]=defaultCatsFor(m==='lunch'||m==='dinner'?'lunch':m);if(!plan[m])plan[m]={categories:{}};});openMeals=new Set([...openMeals].filter(m=>activeMeals.includes(m)));closeMealManager();renderMeals();updateHint();saveMealConfiguration();}
async function saveMealConfiguration(){if(!selected||selected==='All')return;try{const update={foodMealsByFunction:{[selected]:[...activeMeals]},updatedAt:firebase.firestore.FieldValue.serverTimestamp()};await familyRef.doc('__meta__GLOBAL').set(update,{merge:true});if(window.metaGlobal)window.metaGlobal.foodMealsByFunction=window.metaGlobal.foodMealsByFunction||{};if(window.metaGlobal)window.metaGlobal.foodMealsByFunction[selected]=[...activeMeals];await foodRef.doc(storageId()).set({isFoodPlan:true,familyCode:code,eventFunction:selected,activeMeals:[...activeMeals],foodPlan:plan,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});alert('Meal sections updated for '+selected+'.');}catch(e){alert('Unable to save meal sections: '+(e.message||e));}}
function updateCountdown(){const box=document.getElementById('countdown'),dt=String(functionDates?.[selected]||'').slice(0,10),days=document.getElementById('daysText'),label=document.getElementById('daysLabel');if(!dt){days.textContent='—';label.textContent='Set Date';box.title='Set the date in Party Tracker → Manage → Event Functions';return;}const d=new Date(dt+'T00:00:00'),today=new Date();today.setHours(0,0,0,0);const diff=Math.ceil((d-today)/86400000);if(diff>0){days.textContent=diff;label.textContent='Days to Go';}else if(diff===0){days.textContent='🎉';label.textContent='Today';}else{days.textContent=Math.abs(diff);label.textContent='Days Ago';}}
if(code){boot();}
</script>
</body>
</html>
