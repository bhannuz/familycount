<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Event Guest & Headcount Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased p-2 sm:p-3 md:p-4 min-h-screen">
  <div class="max-w-6xl mx-auto space-y-2.5">
    
    <!-- Top Header Bar (Fully Mobile Responsive, No Overflow) -->
    <header class="bg-white p-2.5 sm:p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-2">
      <!-- Title & Admin Badge -->
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold text-xs shrink-0">
            <i class="fa-solid fa-users"></i>
          </div>
          <h1 class="text-xs sm:text-sm font-bold text-slate-900 leading-tight">Guest Headcount & RSVP Tracker</h1>
        </div>

        <div class="flex items-center gap-1 bg-amber-50 border border-amber-300 text-amber-900 px-2 py-0.5 rounded text-[10px] sm:text-[11px] font-bold shadow-xs shrink-0">
          <i class="fa-solid fa-key text-[9px] text-amber-600"></i>
          <span>Admin: <span class="font-mono text-indigo-700">A2KU</span></span>
        </div>
      </div>

      <!-- Action Row: Category Filter + Print + Logout -->
      <div class="flex flex-wrap items-center justify-between gap-1.5 pt-1 border-t border-slate-100">
        <!-- Filter Category Dropdown -->
        <div class="flex items-center gap-1 bg-slate-50 border border-slate-300 rounded px-2 py-1 flex-1 min-w-[130px]">
          <label class="text-[10px] font-bold text-slate-500 uppercase shrink-0">Filter:</label>
          <select id="groupViewFilter" onchange="onGroupFilterChange(this.value)" class="text-xs font-semibold bg-transparent text-indigo-700 outline-none w-full cursor-pointer">
            <option value="All">All Groups</option>
            <option value="Paternal">Paternal Side</option>
            <option value="Maternal">Maternal Side</option>
            <option value="Office Friends">Office Friends</option>
            <option value="School Friends">School Friends</option>
            <option value="College Friends">College Friends</option>
            <option value="Neighbours">Neighbours</option>
          </select>
        </div>

        <!-- Buttons -->
        <div class="flex items-center gap-1.5 shrink-0">
          <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-900 text-white text-[11px] font-semibold px-2.5 py-1 rounded-lg transition flex items-center gap-1">
            <i class="fa-solid fa-print text-[10px]"></i> Print
          </button>
          <button onclick="logoutSession()" class="bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-[11px] font-semibold px-2.5 py-1 rounded-lg transition flex items-center gap-1">
            <i class="fa-solid fa-right-from-bracket text-[10px]"></i> Logout
          </button>
        </div>
      </div>
    </header>

    <!-- Side-by-Side Mobile Chips Layout (2 Columns on mobile for Coming & Total) -->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-2">
      <!-- Chip 1: Confirmed Coming -->
      <div class="bg-indigo-900 text-white p-2.5 rounded-xl shadow-sm flex items-center justify-between col-span-1">
        <div>
          <span class="text-[9px] sm:text-[10px] font-bold uppercase tracking-wider text-indigo-200 block" id="summaryTitle">Coming</span>
          <div class="flex items-baseline gap-1 mt-0.5">
            <span id="statComing" class="text-xl sm:text-2xl font-black text-emerald-300">0</span>
            <span class="text-[9px] text-indigo-200">attending</span>
          </div>
        </div>
        <i class="fa-solid fa-circle-check text-emerald-400 text-lg sm:text-xl opacity-80 shrink-0"></i>
      </div>

      <!-- Chip 2: Total Invited Members (Next to Coming on mobile) -->
      <div class="bg-white border border-slate-200 p-2.5 rounded-xl shadow-sm flex items-center justify-between col-span-1">
        <div>
          <span class="text-[9px] sm:text-[10px] font-bold uppercase text-slate-400 block">Total Invited</span>
          <div class="flex items-baseline gap-1 mt-0.5">
            <span id="statTotal" class="text-xl sm:text-2xl font-bold text-slate-800">0</span>
            <span class="text-[9px] text-slate-400">members</span>
          </div>
        </div>
        <i class="fa-solid fa-user-group text-slate-300 text-lg sm:text-xl shrink-0"></i>
      </div>

      <!-- Chip 3: Gents / Ladies / Kids Combined Single Chip (Spans full width on mobile) -->
      <div class="bg-white border border-slate-200 p-2.5 rounded-xl shadow-sm col-span-2 md:col-span-1 flex flex-col justify-center">
        <span class="text-[9px] sm:text-[10px] font-bold uppercase text-slate-500 block mb-1">Breakdown (G / L / K)</span>
        <div class="flex items-center justify-around text-xs font-bold text-slate-800 bg-slate-50 py-1 px-2 rounded-lg border border-slate-100">
          <span class="text-blue-700">G: <span id="statGents" class="text-xs sm:text-sm font-black">0</span></span>
          <span class="text-slate-300 font-normal">|</span>
          <span class="text-pink-700">L: <span id="statLadies" class="text-xs sm:text-sm font-black">0</span></span>
          <span class="text-slate-300 font-normal">|</span>
          <span class="text-amber-700">K: <span id="statKids" class="text-xs sm:text-sm font-black">0</span></span>
        </div>
      </div>
    </div>

    <!-- Entry Form Card -->
    <div class="bg-white p-2.5 sm:p-3 rounded-xl border border-slate-200 shadow-sm">
      <form id="familyForm" onsubmit="handleFormSubmit(event)" class="space-y-2">
        <input type="hidden" id="docId" value="" />
        
        <!-- Row 1: Category -> Relation -> Guest Name -> Place -> Phone -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-12 gap-1.5">
          <!-- 1. Category / Side -->
          <div class="md:col-span-3">
            <label class="block text-[10px] font-bold uppercase text-slate-500 mb-0.5">Category / Group *</label>
            <div class="flex gap-1">
              <select id="groupSelect" onchange="checkCustomGroup(this.value)" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2 py-1.5 text-xs font-semibold text-slate-700 focus:outline-none focus:border-indigo-500">
                <option value="Paternal">Paternal Side</option>
                <option value="Maternal">Maternal Side</option>
                <option value="Office Friends">Office Friends</option>
                <option value="School Friends">School Friends</option>
                <option value="College Friends">College Friends</option>
                <option value="Neighbours">Neighbours</option>
                <option value="__custom_group__">+ Add Custom Group...</option>
              </select>
              <input type="text" id="customGroupInput" placeholder="Enter Group Name" class="hidden w-full bg-white border border-indigo-400 rounded-lg px-2 py-1.5 text-xs font-semibold focus:outline-none" />
            </div>
          </div>

          <!-- 2. Relation (Optional) -->
          <div class="md:col-span-2">
            <label class="block text-[10px] font-bold uppercase text-slate-400 mb-0.5">Relation (Optional)</label>
            <div class="flex gap-1">
              <select id="relationSelect" onchange="checkCustomRelation(this.value)" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2 py-1.5 text-xs font-semibold text-slate-700 focus:outline-none focus:border-indigo-500">
                <option value="">— None / Optional —</option>
                <option value="Friend">Friend</option>
                <option value="Colleague">Colleague</option>
                <option value="Babai / Chacha">Babai / Chacha</option>
                <option value="Peddananna / Tauji">Peddananna / Tauji</option>
                <option value="Mama / Uncle">Mama / Uncle</option>
                <option value="Atta / Bua / Mami">Atta / Bua / Mami</option>
                <option value="Annaya / Bhaiya">Annaya / Bhaiya</option>
                <option value="Thammudu / Younger Bro">Thammudu / Bro</option>
                <option value="Akka / Didi">Akka / Didi</option>
                <option value="Chelli / Younger Sis">Chelli / Sis</option>
                <option value="Bava / Jiju">Bava / Jiju</option>
                <option value="Cousin">Cousin</option>
                <option value="__custom_rel__">+ Custom...</option>
              </select>
              <input type="text" id="customRelationInput" placeholder="Enter Relation" class="hidden w-full bg-white border border-indigo-400 rounded-lg px-2 py-1.5 text-xs font-semibold focus:outline-none" />
            </div>
          </div>

          <!-- 3. Family / Guest Name -->
          <div class="md:col-span-3">
            <label class="block text-[10px] font-bold uppercase text-slate-500 mb-0.5">Guest / Head Name *</label>
            <input type="text" id="familyName" required placeholder="e.g. Ramesh & Family" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:border-indigo-500" />
          </div>

          <!-- 4. Place -->
          <div class="md:col-span-2">
            <label class="block text-[10px] font-bold uppercase text-slate-500 mb-0.5">Place</label>
            <input type="text" id="familyPlace" placeholder="e.g. Hyderabad" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:border-indigo-500" />
          </div>

          <!-- 5. Phone -->
          <div class="md:col-span-2">
            <label class="block text-[10px] font-bold uppercase text-slate-500 mb-0.5">Phone Number</label>
            <input type="tel" id="familyPhone" placeholder="Mobile Number" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:border-indigo-500" />
          </div>
        </div>

        <!-- Row 2: Counts & Actions -->
        <div class="grid grid-cols-3 md:grid-cols-12 gap-1.5 items-end">
          <div class="col-span-1 md:col-span-2">
            <label class="block text-[10px] font-bold text-blue-700 mb-0.5 text-center">Gents</label>
            <input type="number" id="gentsCount" min="0" value="1" required class="w-full text-center bg-slate-50 border border-slate-300 rounded-lg py-1.5 text-xs font-bold focus:outline-none" />
          </div>

          <div class="col-span-1 md:col-span-2">
            <label class="block text-[10px] font-bold text-pink-700 mb-0.5 text-center">Ladies</label>
            <input type="number" id="ladiesCount" min="0" value="1" required class="w-full text-center bg-slate-50 border border-slate-300 rounded-lg py-1.5 text-xs font-bold focus:outline-none" />
          </div>

          <div class="col-span-1 md:col-span-2">
            <label class="block text-[10px] font-bold text-amber-700 mb-0.5 text-center">Kids</label>
            <input type="number" id="kidsCount" min="0" value="0" required class="w-full text-center bg-slate-50 border border-slate-300 rounded-lg py-1.5 text-xs font-bold focus:outline-none" />
          </div>

          <div class="col-span-3 md:col-span-4">
            <label class="block text-[10px] font-bold uppercase text-slate-500 mb-0.5">Kid Names (Optional)</label>
            <input type="text" id="kidNames" placeholder="e.g. Aryan, Riya" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:border-indigo-500" />
          </div>

          <div class="col-span-3 md:col-span-2 flex gap-1 pt-1 md:pt-0">
            <button type="submit" id="saveBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2 rounded-lg transition shadow-sm">
              Add Entry
            </button>
            <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden px-3 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold py-2 rounded-lg transition">
              ✕
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- Collapsible Guest History Section (Collapsed by Default) -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <!-- Accordion Header Bar -->
      <button type="button" onclick="toggleHistoryAccordion()" class="w-full flex items-center justify-between px-3 py-2.5 bg-slate-50 hover:bg-slate-100 border-b border-slate-200 transition text-left">
        <div class="flex items-center gap-2">
          <i id="accordionChevron" class="fa-solid fa-chevron-right text-xs text-indigo-600 transition-transform duration-200"></i>
          <span class="text-xs font-bold text-slate-800">Guest History & Attendance List</span>
          <span id="historyBadgeCount" class="text-[10px] font-bold bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded-full">0 Entries</span>
        </div>
        <span id="accordionActionText" class="text-[11px] font-semibold text-indigo-600">Tap to Expand</span>
      </button>

      <!-- Collapsible Container (Hidden by default) -->
      <div id="historyContainer" class="hidden p-2.5 space-y-2">
        <!-- Search Filter -->
        <div class="flex items-center justify-between gap-2">
          <span id="tableCountLabel" class="text-[11px] font-bold text-slate-500">Showing 0 entries</span>
          <input type="text" id="searchInput" oninput="renderTable()" placeholder="Search guest name, category, place..." class="bg-slate-50 border border-slate-300 text-xs px-2.5 py-1 rounded-lg w-48 sm:w-64 focus:outline-none focus:border-indigo-500" />
        </div>

        <!-- Table -->
        <div class="overflow-x-auto border border-slate-200 rounded-lg">
          <table class="w-full text-left text-xs border-collapse">
            <thead>
              <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-bold uppercase text-[10px]">
                <th class="py-2 px-2.5">Category</th>
                <th class="py-2 px-2">Relation</th>
                <th class="py-2 px-2.5">Guest & Place</th>
                <th class="py-2 px-1 text-center text-blue-700">G</th>
                <th class="py-2 px-1 text-center text-pink-700">L</th>
                <th class="py-2 px-1 text-center text-amber-700">K</th>
                <th class="py-2 px-1.5 text-center font-bold text-slate-500">Total</th>
                <th class="py-2 px-2 text-center">RSVP</th>
                <th class="py-2 px-2 text-center bg-emerald-50/60 text-emerald-900 font-bold">Attending</th>
                <th class="py-2 px-2 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="familyTableBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
        <p id="emptyMessage" class="hidden text-center py-4 text-slate-400 text-xs">No matching entries found.</p>
      </div>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDbMtnm-PXJfs1ZEobc-lxu7T1yjFSjtUg",
      authDomain: "familycount-c6860.firebaseapp.com",
      databaseURL: "https://familycount-c6860-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "familycount-c6860",
      storageBucket: "familycount-c6860.firebasestorage.app",
      messagingSenderId: "206416370169",
      appId: "1:206416370169:web:27e5cf09964244326cc528",
      measurementId: "G-13PFL67Q6B"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const collectionRef = db.collection("family_count");

    let families = [];
    let currentGroupFilter = 'All';
    let isHistoryExpanded = false;

    // Realtime Firestore sync
    collectionRef.onSnapshot((snapshot) => {
      families = [];
      snapshot.forEach((doc) => {
        families.push({ id: doc.id, ...doc.data() });
      });
      syncCategoryFilterDropdown();
      renderDashboard();
      renderTable();
    });

    function toggleHistoryAccordion() {
      isHistoryExpanded = !isHistoryExpanded;
      const container = document.getElementById('historyContainer');
      const chevron = document.getElementById('accordionChevron');
      const actionText = document.getElementById('accordionActionText');

      if (isHistoryExpanded) {
        container.classList.remove('hidden');
        chevron.classList.add('rotate-90');
        actionText.textContent = 'Tap to Collapse';
      } else {
        container.classList.add('hidden');
        chevron.classList.remove('rotate-90');
        actionText.textContent = 'Tap to Expand';
      }
    }

    function logoutSession() {
      if (confirm('Are you sure you want to logout and reset view?')) {
        localStorage.clear();
        window.location.reload();
      }
    }

    function onGroupFilterChange(val) {
      currentGroupFilter = val;
      renderDashboard();
      renderTable();
    }

    function checkCustomGroup(val) {
      const customInput = document.getElementById('customGroupInput');
      const select = document.getElementById('groupSelect');
      if (val === '__custom_group__') {
        select.classList.add('hidden');
        customInput.classList.remove('hidden');
        customInput.focus();
      }
    }

    function checkCustomRelation(val) {
      const customInput = document.getElementById('customRelationInput');
      const select = document.getElementById('relationSelect');
      if (val === '__custom_rel__') {
        select.classList.add('hidden');
        customInput.classList.remove('hidden');
        customInput.focus();
      }
    }

    function syncCategoryFilterDropdown() {
      const filterSelect = document.getElementById('groupViewFilter');
      const defaultOptions = ['All', 'Paternal', 'Maternal', 'Office Friends', 'School Friends', 'College Friends', 'Neighbours'];
      const uniqueGroups = new Set(defaultOptions);

      families.forEach(f => {
        if (f.side) uniqueGroups.add(f.side);
      });

      const currentVal = filterSelect.value;
      filterSelect.innerHTML = '';
      uniqueGroups.forEach(grp => {
        const opt = document.createElement('option');
        opt.value = grp;
        opt.textContent = grp === 'All' ? 'All Groups' : (grp.includes('Side') || grp.includes('Friends') || grp.includes('Neighbours') ? grp : `${grp} Group`);
        filterSelect.appendChild(opt);
      });
      filterSelect.value = uniqueGroups.has(currentVal) ? currentVal : 'All';
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const docId = document.getElementById('docId').value;
      
      const customGroupInput = document.getElementById('customGroupInput');
      const groupSelect = document.getElementById('groupSelect');
      let finalGroup = (!customGroupInput.classList.contains('hidden') && customGroupInput.value.trim()) 
        ? customGroupInput.value.trim() 
        : groupSelect.value;

      const customRelInput = document.getElementById('customRelationInput');
      const relSelect = document.getElementById('relationSelect');
      let finalRelation = (!customRelInput.classList.contains('hidden') && customRelInput.value.trim()) 
        ? customRelInput.value.trim() 
        : relSelect.value;

      const gents = parseInt(document.getElementById('gentsCount').value) || 0;
      const ladies = parseInt(document.getElementById('ladiesCount').value) || 0;
      const kids = parseInt(document.getElementById('kidsCount').value) || 0;

      const record = {
        side: finalGroup,
        relation: finalRelation || '',
        name: document.getElementById('familyName').value.trim(),
        place: document.getElementById('familyPlace').value.trim(),
        phone: document.getElementById('familyPhone').value.trim(),
        gents: gents,
        ladies: ladies,
        kids: kids,
        kidNames: document.getElementById('kidNames').value.trim(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      if (!docId) {
        record.invitation = "Invited";
        record.comingCount = gents + ladies + kids;
      }

      if (docId) {
        await collectionRef.doc(docId).update(record);
      } else {
        await collectionRef.add(record);
      }

      resetForm();
    }

    async function updateInvitation(id, val) {
      const item = families.find(f => f.id === id);
      const totalFamily = (item.gents || 0) + (item.ladies || 0) + (item.kids || 0);
      
      let updatePayload = {
        invitation: val,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      if (val === 'Invited' && (!item.comingCount || item.comingCount === 0)) {
        updatePayload.comingCount = totalFamily;
      } else if (val === 'Not Invited') {
        updatePayload.comingCount = 0;
      }

      await collectionRef.doc(id).update(updatePayload);
    }

    async function updateComingCount(id, val) {
      const count = parseInt(val) || 0;
      await collectionRef.doc(id).update({
        comingCount: count,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    function editEntry(id) {
      const item = families.find(f => f.id === id);
      if (!item) return;

      document.getElementById('docId').value = item.id;
      
      const groupSelect = document.getElementById('groupSelect');
      const customGroupInput = document.getElementById('customGroupInput');
      let groupExists = false;
      for (let opt of groupSelect.options) {
        if (opt.value === item.side) {
          groupExists = true;
          break;
        }
      }
      if (groupExists) {
        groupSelect.value = item.side;
        groupSelect.classList.remove('hidden');
        customGroupInput.classList.add('hidden');
      } else {
        groupSelect.classList.add('hidden');
        customGroupInput.classList.remove('hidden');
        customGroupInput.value = item.side || '';
      }

      const relSelect = document.getElementById('relationSelect');
      const customRelInput = document.getElementById('customRelationInput');
      let relExists = false;
      for (let opt of relSelect.options) {
        if (opt.value === item.relation) {
          relExists = true;
          break;
        }
      }
      if (relExists) {
        relSelect.value = item.relation || '';
        relSelect.classList.remove('hidden');
        customRelInput.classList.add('hidden');
      } else {
        relSelect.classList.add('hidden');
        customRelInput.classList.remove('hidden');
        customRelInput.value = item.relation || '';
      }

      document.getElementById('familyName').value = item.name;
      document.getElementById('familyPlace').value = item.place || '';
      document.getElementById('familyPhone').value = item.phone || '';
      document.getElementById('gentsCount').value = item.gents || 0;
      document.getElementById('ladiesCount').value = item.ladies || 0;
      document.getElementById('kidsCount').value = item.kids || 0;
      document.getElementById('kidNames').value = item.kidNames || '';

      document.getElementById('saveBtn').textContent = 'Update Entry';
      document.getElementById('cancelBtn').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteEntry(id) {
      const item = families.find(f => f.id === id);
      if (confirm(`Delete ${item ? item.name : 'this entry'}?`)) {
        await collectionRef.doc(id).delete();
      }
    }

    function resetForm() {
      document.getElementById('familyForm').reset();
      document.getElementById('docId').value = '';
      document.getElementById('gentsCount').value = 1;
      document.getElementById('ladiesCount').value = 1;
      document.getElementById('kidsCount').value = 0;
      
      const groupSelect = document.getElementById('groupSelect');
      const customGroupInput = document.getElementById('customGroupInput');
      groupSelect.classList.remove('hidden');
      groupSelect.selectedIndex = 0;
      customGroupInput.classList.add('hidden');
      customGroupInput.value = '';

      const relSelect = document.getElementById('relationSelect');
      const customRelInput = document.getElementById('customRelationInput');
      relSelect.classList.remove('hidden');
      relSelect.selectedIndex = 0;
      customRelInput.classList.add('hidden');
      customRelInput.value = '';

      document.getElementById('saveBtn').textContent = 'Add Entry';
      document.getElementById('cancelBtn').classList.add('hidden');
    }

    function renderDashboard() {
      const targetFamilies = (currentGroupFilter === 'All') 
        ? families 
        : families.filter(f => f.side === currentGroupFilter);

      let gCount = 0, lCount = 0, kCount = 0, comingCount = 0;

      targetFamilies.forEach(f => {
        const g = f.gents || 0;
        const l = f.ladies || 0;
        const k = f.kids || 0;
        const coming = parseInt(f.comingCount) || 0;

        gCount += g;
        lCount += l;
        kCount += k;
        comingCount += coming;
      });

      document.getElementById('summaryTitle').textContent = currentGroupFilter === 'All' 
        ? 'Coming' 
        : `${currentGroupFilter}`;

      document.getElementById('statComing').textContent = comingCount;
      document.getElementById('statTotal').textContent = gCount + lCount + kCount;
      document.getElementById('statGents').textContent = gCount;
      document.getElementById('statLadies').textContent = lCount;
      document.getElementById('statKids').textContent = kCount;
      document.getElementById('historyBadgeCount').textContent = `${families.length} Entries`;
    }

    function getGroupBadge(group) {
      if (!group) return `<span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-slate-100 text-slate-700">General</span>`;
      if (group === 'Paternal') return `<span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-blue-100 text-blue-800">Paternal</span>`;
      if (group === 'Maternal') return `<span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-purple-100 text-purple-800">Maternal</span>`;
      if (group.includes('Office')) return `<span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-cyan-100 text-cyan-800">Office</span>`;
      if (group.includes('School')) return `<span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-emerald-100 text-emerald-800">School</span>`;
      if (group.includes('College')) return `<span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-amber-100 text-amber-800">College</span>`;
      return `<span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-indigo-50 text-indigo-700 border border-indigo-200">${group}</span>`;
    }

    function renderTable() {
      const tbody = document.getElementById('familyTableBody');
      const search = document.getElementById('searchInput').value.toLowerCase();
      tbody.innerHTML = '';

      const filtered = families.filter(f => {
        const matchesGroup = (currentGroupFilter === 'All') || (f.side === currentGroupFilter);
        const matchesSearch = (f.name && f.name.toLowerCase().includes(search)) || 
                              (f.side && f.side.toLowerCase().includes(search)) || 
                              (f.relation && f.relation.toLowerCase().includes(search)) || 
                              (f.place && f.place.toLowerCase().includes(search)) || 
                              (f.phone && f.phone.includes(search)) || 
                              (f.kidNames && f.kidNames.toLowerCase().includes(search));
        return matchesGroup && matchesSearch;
      });

      document.getElementById('tableCountLabel').textContent = `Showing ${filtered.length} of ${families.length}`;

      if (filtered.length === 0) {
        document.getElementById('emptyMessage').classList.remove('hidden');
      } else {
        document.getElementById('emptyMessage').classList.add('hidden');
      }

      filtered.forEach(item => {
        const total = (item.gents || 0) + (item.ladies || 0) + (item.kids || 0);
        const isInvited = (item.invitation === 'Invited');
        const comingCount = (item.comingCount !== undefined) ? item.comingCount : 0;

        const inviteSelect = `
          <select onchange="updateInvitation('${item.id}', this.value)" class="text-[10px] font-semibold px-1 py-0.5 rounded border focus:outline-none ${
            isInvited ? 'bg-emerald-50 text-emerald-800 border-emerald-300' : 'bg-slate-50 text-slate-600 border-slate-300'
          }">
            <option value="Not Invited" ${!isInvited ? 'selected' : ''}>⏳ Pending</option>
            <option value="Invited" ${isInvited ? 'selected' : ''}>📩 Invited</option>
          </select>
        `;

        const comingInput = `
          <div class="flex items-center justify-center gap-1">
            <input type="number" min="0" max="${total}" value="${comingCount}" 
              onchange="updateComingCount('${item.id}', this.value)"
              class="w-10 text-center text-xs font-black py-0.5 rounded border ${
                comingCount > 0 ? 'bg-emerald-100 text-emerald-900 border-emerald-500' : 'bg-slate-50 text-slate-400 border-slate-300'
              } focus:outline-none" />
            <span class="text-[9px] text-slate-400 font-semibold">/${total}</span>
          </div>
        `;

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50 transition';
        tr.innerHTML = `
          <td class="py-1.5 px-2.5">${getGroupBadge(item.side)}</td>
          <td class="py-1.5 px-2 font-medium text-slate-700 text-xs">${item.relation || '—'}</td>
          <td class="py-1.5 px-2.5">
            <div class="font-semibold text-slate-800 text-xs leading-tight">${item.name}</div>
            <div class="text-[10px] text-slate-400 flex items-center gap-2 mt-0.5">
              ${item.place ? `<span><i class="fa-solid fa-location-dot mr-0.5"></i>${item.place}</span>` : ''}
              ${item.phone ? `<span><i class="fa-solid fa-phone mr-0.5"></i>${item.phone}</span>` : ''}
            </div>
            ${item.kidNames ? `<div class="text-[10px] text-amber-700 mt-0.5"><i class="fa-solid fa-child text-[9px] mr-1"></i>${item.kidNames}</div>` : ''}
          </td>
          <td class="py-1.5 px-1 text-center text-slate-700 font-medium">${item.gents || 0}</td>
          <td class="py-1.5 px-1 text-center text-slate-700 font-medium">${item.ladies || 0}</td>
          <td class="py-1.5 px-1 text-center text-amber-700 font-bold">${item.kids || 0}</td>
          <td class="py-1.5 px-1.5 text-center font-bold text-slate-600">${total}</td>
          <td class="py-1.5 px-2 text-center">${inviteSelect}</td>
          <td class="py-1.5 px-2 text-center bg-emerald-50/30">${comingInput}</td>
          <td class="py-1.5 px-2 text-right">
            <button onclick="editEntry('${item.id}')" class="text-slate-400 hover:text-indigo-600 px-1" title="Edit"><i class="fa-solid fa-pen"></i></button>
            <button onclick="deleteEntry('${item.id}')" class="text-slate-400 hover:text-rose-600 px-1" title="Delete"><i class="fa-solid fa-trash"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
